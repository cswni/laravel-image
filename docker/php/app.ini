; Laravel dev defaults. memory_limit is written at boot by default.sh
; from PHP_MEMORY_LIMIT (zz-memory.ini).

[PHP]
max_execution_time=300
max_input_vars=10000
upload_max_filesize=100M
post_max_size=100M
expose_php=Off
log_errors=On
error_log=/dev/stderr
realpath_cache_size=4096K
realpath_cache_ttl=600

[Date]
date.timezone=UTC
