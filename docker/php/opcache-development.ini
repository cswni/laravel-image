; ─── OPcache · DEVELOPMENT ───────────────────────────────────────────────────
; Enabled with timestamp checking so file edits are picked up automatically.
; JIT disabled for easier debugging and xdebug compatibility.

[opcache]
opcache.enable=1
opcache.enable_cli=1

; Memory (smaller footprint in dev)
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=32531

; DEVELOPMENT: stat every request so edited files reload immediately
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Performance
opcache.fast_shutdown=1
opcache.enable_file_override=0

; Required for Laravel annotations / attributes
opcache.save_comments=1
opcache.load_comments=1

; JIT disabled — avoids conflicts with Xdebug / step-debuggers
opcache.jit_buffer_size=0
opcache.jit=0

; Diagnostics
opcache.error_log=/dev/stderr
opcache.log_verbosity_level=2

; Safety
opcache.validate_permission=1
opcache.validate_root=1

; Tuning
opcache.huge_code_pages=0
opcache.protect_memory=0
opcache.max_wasted_percentage=10
opcache.consistency_checks=0
opcache.force_restart_timeout=180
