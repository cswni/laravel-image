; ─── OPcache · DEVELOPMENT ───────────────────────────────────────────────────
; validate_timestamps=1 makes edits visible on the next request in classic mode
; and to new Octane workers after a reload/--watch restart.
; JIT off: avoids conflicts with Xdebug.

[opcache]
opcache.enable=1
opcache.enable_cli=1

opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=32531

opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Required for Laravel attributes / reflection
opcache.save_comments=1

opcache.jit=disable
opcache.jit_buffer_size=0

opcache.error_log=/dev/stderr
opcache.log_verbosity_level=1
opcache.max_wasted_percentage=10
