; ─── OPcache · PRODUCTION ────────────────────────────────────────────────────
; Maximum performance: timestamps disabled, JIT tracing enabled.

[opcache]
opcache.enable=1
opcache.enable_cli=1

; Memory
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531

; PRODUCTION: never stat files — zero inode overhead per request
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Performance
opcache.fast_shutdown=1
opcache.enable_file_override=1

; Required for Laravel annotations / attributes
opcache.save_comments=1
opcache.load_comments=1

; Full optimisation suite (skip pass 4 which can alter semantics)
opcache.optimization_level=0x7FFEBFFF

; JIT — tracing mode is best for Laravel request/response cycles
opcache.jit_buffer_size=128M
opcache.jit=tracing

; Preload — uncomment once you have a preload.php
; opcache.preload=/var/www/html/preload.php
; opcache.preload_user=www-data

; File cache for fast warm-up after container restart
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0
opcache.file_cache_consistency_checks=1

; Diagnostics
opcache.error_log=/dev/stderr
opcache.log_verbosity_level=1

; Safety
opcache.validate_permission=1
opcache.validate_root=1

; Tuning
opcache.huge_code_pages=0
; protect_memory=1 causes SIGSEGV (kernel error 7) with JIT tracing on PHP 8.4:
; the JIT patcher writes to compiled pages after they are marked read-only.
; Must be 0 when opcache.jit is active.
opcache.protect_memory=0
opcache.max_wasted_percentage=5
opcache.consistency_checks=0
opcache.force_restart_timeout=180
