; ─── OPcache · PRODUCTION ────────────────────────────────────────────────────
; Code is baked into the image: never stat files, JIT tracing on.

[opcache]
opcache.enable=1
opcache.enable_cli=1

opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531

opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Required for Laravel attributes / reflection
opcache.save_comments=1

opcache.jit=tracing
opcache.jit_buffer_size=128M
; protect_memory=1 segfaults with JIT tracing on PHP 8.4 (JIT writes to
; pages already marked read-only). Must stay 0 while JIT is on.
opcache.protect_memory=0

opcache.error_log=/dev/stderr
opcache.log_verbosity_level=1
opcache.max_wasted_percentage=5
