; OPcache configuration for Laravel & FilamentPHP
; Optimized for production, can be overridden for development

[opcache]
; Enable OPcache
opcache.enable=${PHP_OPCACHE_ENABLE}
opcache.enable_cli=1

; Memory settings (increased for Laravel + Filament)
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531

; Revalidation settings
; In production: validate_timestamps=0 for maximum performance
; In development: validate_timestamps=1 for automatic reloading
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq=0

; Performance optimizations
opcache.fast_shutdown=1
opcache.enable_file_override=1

; Save comments for Laravel's reflection-based features (required!)
opcache.save_comments=1
opcache.load_comments=1

; Optimization level (all optimizations except pass 4)
opcache.optimization_level=0x7FFEBFFF

; JIT Configuration for PHP 8.3+
; tracing JIT is best for Laravel workloads
opcache.jit_buffer_size=128M
opcache.jit=tracing

; Preload support for Laravel (configure in production)
; opcache.preload=/var/www/html/preload.php
; opcache.preload_user=www-data

; File cache for better performance in containerized environments
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0
opcache.file_cache_consistency_checks=1

; Logging and monitoring
opcache.error_log=/dev/stderr
opcache.log_verbosity_level=1

; Prevent accidental file corruption
opcache.validate_permission=1
opcache.validate_root=1

; Additional performance settings
opcache.huge_code_pages=0
opcache.protect_memory=1
opcache.max_wasted_percentage=5
opcache.consistency_checks=0
opcache.force_restart_timeout=180

