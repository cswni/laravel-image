version: '3.8'

services:
  # Laravel Application with FrankenPHP
  app:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: laravel-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Application settings
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_MODE: ${APP_MODE:-api}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}

      # Database
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_DRIVER: ${CACHE_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}

      # PHP Configuration
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-60}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-100M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-100M}
      PHP_TIMEZONE: ${PHP_TIMEZONE:-UTC}

      # OPcache Configuration
      PHP_OPCACHE_ENABLE: ${PHP_OPCACHE_ENABLE:-1}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-0}

      # FrankenPHP Configuration
      FRANKENPHP_NUM_THREADS: ${FRANKENPHP_NUM_THREADS:-8}
      FRANKENPHP_WORKER_FILE: ${FRANKENPHP_WORKER_FILE:-}

      # Logging
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./:/var/www/html
      - ./docker/entrypoints:/usr/local/bin:ro
    depends_on:
      - db
      - redis
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - laravel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Queue Worker (optional - uncomment if needed)
  # queue:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.optimized
  #   container_name: laravel-queue
  #   restart: unless-stopped
  #   environment:
  #     APP_ENV: ${APP_ENV:-production}
  #     APP_MODE: queue
  #     # ... same environment variables as app
  #   volumes:
  #     - ./:/var/www/html
  #   depends_on:
  #     - app
  #     - redis
  #   networks:
  #     - laravel-network

  # Scheduler (optional - uncomment if needed)
  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.optimized
  #   container_name: laravel-scheduler
  #   restart: unless-stopped
  #   environment:
  #     APP_ENV: ${APP_ENV:-production}
  #     APP_MODE: scheduler
  #     # ... same environment variables as app
  #   volumes:
  #     - ./:/var/www/html
  #   depends_on:
  #     - app
  #   networks:
  #     - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db-data:
  redis-data:

